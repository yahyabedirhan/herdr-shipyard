id = "yahyabedirhan.herdr-shipyard"
name = "herdr-shipyard"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Puts the shipyard command on this machine, pings shipyard when an agent here is blocked, and holds notices for the Mac."
platforms = ["linux", "macos"]

# Shipyard publishes the shipyard command for Linux only. On macOS the
# shipyard app already carries it, so every entry below is Linux-only and the
# plugin does nothing there.

[[build]]
command = ["sh", "scripts/install-shipyard.sh"]
platforms = ["linux"]

[[startup]]
command = ["sh", "scripts/link-shipyard.sh"]
platforms = ["linux"]

[[actions]]
id = "list"
title = "List shipyard pings as JSON"
command = ["sh", "scripts/shipyard.sh", "ping", "list", "--json"]
platforms = ["linux"]

# Shipyard's notices wait here until the Mac's poll collects them: `notices`
# lists them, oldest first, and `notices-read` removes the ones that listing
# handed out, once the Mac has read them.
[[actions]]
id = "notices"
title = "List shipyard notices as JSON"
command = ["sh", "scripts/notices.sh", "list"]
platforms = ["linux"]

[[actions]]
id = "notices-read"
title = "Remove the shipyard notices the last listing handed out"
command = ["sh", "scripts/notices.sh", "read"]
platforms = ["linux"]

[[actions]]
id = "link"
title = "Link shipyard into ~/.local/bin"
command = ["sh", "scripts/link-shipyard.sh"]
platforms = ["linux"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "scripts/shipyard.sh", "herdr-event"]
platforms = ["linux"]

[[events]]
on = "pane.closed"
command = ["sh", "scripts/shipyard.sh", "herdr-event"]
platforms = ["linux"]

# Herdr sends no pane.closed for the panes a closed tab or workspace takes
# with it, so these let shipyard withdraw their blocked pings too.
[[events]]
on = "tab.closed"
command = ["sh", "scripts/shipyard.sh", "herdr-event"]
platforms = ["linux"]

[[events]]
on = "workspace.closed"
command = ["sh", "scripts/shipyard.sh", "herdr-event"]
platforms = ["linux"]
